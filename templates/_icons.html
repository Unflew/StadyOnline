{% macro icon(name, size=22) -%}
<svg width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{%- if name == 'flame' %}<path d="M12 2.500c.5 3.200 4.500 5 4.500 10a4.500 4.500 0 0 1-9 0c0-1.800.8-3 1.800-4 .2 1.200.8 2 1.700 2.300C10.500 8.500 10.300 5 12 2.500Z"/>
{%- elif name == 'check' %}<path d="m5 12.500 4.500 4.500L19 7.500"/>
{%- elif name == 'star' %}<path d="m12 3 2.700 5.600 6.100.8-4.500 4.200 1.100 6.100-5.400-2.900-5.400 2.900 1.100-6.100L3.200 9.400l6.100-.8L12 3Z"/>
{%- elif name == 'bolt' %}<path d="M13 2.500 5 13.500h6l-1 8 8-11h-6l1-8Z"/>
{%- elif name == 'redo' %}<path d="M20 11a8 8 0 1 0-2.300 5.700M20 4.500V11h-6.500"/>
{%- elif name == 'flag' %}<path d="M5 21V4M5 4h11l-2 4 2 4H5"/>
{%- endif %}</svg>
{%- endmacro %}
