<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1180">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <title>{% block title %}Курсы{% endblock %} — TeamOnline</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='portal.css') }}">
</head>
<body class="{% block bodyclass %}{% endblock %}">
  <header class="topbar">
    <div class="topbar-in">
      <a class="brand" href="/">
        <span class="brand-mark">
          <svg width="25" height="20" viewBox="0 0 25 20" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
            <path d="M12.5 4.2C10.4 2.4 7 1.6 1.5 1.6v14.6c5.500 0 8.900.8 11 2.600 2.100-1.800 5.500-2.600 11-2.600V1.600c-5.500 0-8.900.8-11 2.600Z"/>
            <path d="M12.500 4.200v14.600"/>
          </svg>
        </span>
        <span class="brand-name">TeamOnline</span>
      </a>
      {% if me %}
      <nav class="nav" aria-label="Разделы">
        {% for href, label, on in nav %}<a href="{{ href }}"{% if on %} class="on" aria-current="page"{% endif %}>{{ label }}</a>{% endfor %}
      </nav>
      <div class="me">
        <div class="me-text"><b>{{ me.name }}</b><span>{{ me.role_label }}</span></div>
        <div class="avatar">{{ me.initials }}</div>
        <form class="logout-form" method="post" action="/logout">
          <input type="hidden" name="csrf" value="{{ csrf_token() }}">
          <button class="logout" type="submit" title="Выйти" aria-label="Выйти">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
          </button>
        </form>
      </div>
      {% endif %}
    </div>
  </header>

  {% block content %}{% endblock %}

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
  <script src="{{ url_for('static', filename='portal.js') }}"></script>
</body>
</html>
