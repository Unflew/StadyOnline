<section class="card head-card s-{{ c.status }}">
  <div class="bar-clip"><i></i></div>
  <div class="a h-row"><h1>{{ c.title }}</h1><span class="h-badge st-c-{{ c.status }}">{{ c.pill }}</span></div>
  <p class="a h-meta">{{ c.span }} / Куратор: {{ c.curator }} / Учащихся {{ c.enrolled }} из {{ c.capacity }}</p>
  <a class="a hb hb-archive" href="/" style="display:grid;place-items:center">← К курсам</a>
</section>
